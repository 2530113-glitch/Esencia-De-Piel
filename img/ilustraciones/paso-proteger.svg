<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><style>
.flota{animation:flota 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flota2{animation:flota 6s ease-in-out -2s infinite;transform-box:fill-box;transform-origin:center}
.brilla{animation:brilla 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.brilla2{animation:brilla 3.4s ease-in-out -1.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes flota{50%{transform:translateY(-10px)}}
@keyframes brilla{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
